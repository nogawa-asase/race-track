# 開発ガイドラインの「CI(GitHub Actions)」のジョブ
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: lint・型チェック・テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: ビルドと配信サイズ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:size

  e2e:
    name: E2Eテスト
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  sim:
    name: シミュレーション
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ルール・CPU・コースを変えた PR だけで実行する(外部のアクションを増やさないため git diff で判定する)
      - name: 対象の変更があるか確かめる
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^src/(domain|courses)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.changes.outputs.run == 'true'
        run: npm ci
      - if: steps.changes.outputs.run == 'true'
        run: npm run test:sim
