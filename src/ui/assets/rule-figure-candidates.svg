<svg width="320" height="430" viewBox="0 0 320 430" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>いきおいの図</title>
<desc>一つ前の場所から今の場所まで進んだ線と、次に進める9つの候補点、それをつなぐ灰色の矢印</desc>

<g stroke="#DCE3D2" stroke-width="1">
<line x1="0" y1="40" x2="320" y2="40"/><line x1="0" y1="110" x2="320" y2="110"/>
<line x1="0" y1="180" x2="320" y2="180"/><line x1="0" y1="250" x2="320" y2="250"/>
<line x1="0" y1="320" x2="320" y2="320"/><line x1="0" y1="390" x2="320" y2="390"/>
<line x1="30" y1="0" x2="30" y2="430"/><line x1="100" y1="0" x2="100" y2="430"/>
<line x1="170" y1="0" x2="170" y2="430"/><line x1="240" y1="0" x2="240" y2="430"/>
<line x1="310" y1="0" x2="310" y2="430"/>
</g>

<defs>
<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1L8 5L1 9" fill="none" stroke="#888780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="30" y1="390" x2="100" y2="250" stroke="#D8432B" stroke-width="4" stroke-linecap="round"/>

<rect x="78" y="18" width="184" height="184" rx="14" fill="none" stroke="#9A9A92" stroke-width="1.5" stroke-dasharray="5 5"/>

<g fill="#F5C4B3" stroke="#D8432B" stroke-width="2.5">
<circle cx="100" cy="40" r="15"/><circle cx="170" cy="40" r="15"/><circle cx="240" cy="40" r="15"/>
<circle cx="100" cy="110" r="15"/><circle cx="240" cy="110" r="15"/>
<circle cx="100" cy="180" r="15"/><circle cx="240" cy="180" r="15"/>
</g>
<circle cx="170" cy="180" r="15" fill="#F5C4B3" stroke="#D8432B" stroke-width="2.5"/>
<circle cx="170" cy="110" r="17" fill="#F0997B" stroke="#D8432B" stroke-width="3"/>

<line x1="100" y1="250" x2="161" y2="127" stroke="#888780" stroke-width="3.5" stroke-dasharray="9 7" stroke-linecap="round" marker-end="url(#ah)"/>

<circle cx="30" cy="390" r="9" fill="#1A1A1A"/>
<circle cx="100" cy="250" r="15" fill="#D8432B"/>

<g font-family="Hiragino Sans, Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" fill="#34373B">
<text x="78" y="245" font-size="15" text-anchor="end">今の場所</text>
<text x="46" y="380" font-size="15">ひとつ前の場所</text>

<text x="221" y="227" font-size="15" text-anchor="middle">次に進める候補(9点)</text>
<text x="221" y="247" font-size="13" fill="#5F5E5A" text-anchor="middle">中央=前と同じ速さ</text>
</g>
</svg>
