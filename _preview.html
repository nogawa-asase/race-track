<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="/src/ui/styles/theme.css">
<link rel="stylesheet" href="/src/ui/styles/screens.css">
<style>body{margin:0;background:#eee;padding:16px}
.wrap{position:relative;background:#fff;width:400px;height:300px}</style>
</head>
<body>
<div id="s1"></div>
<div class="wrap"><div id="s2"></div></div>
<script type="module">
import { SettingsScreen } from '/src/ui/screens/SettingsScreen.ts';
import { ResultScreen } from '/src/ui/screens/ResultScreen.ts';

const settings = new SettingsScreen(document.getElementById('s1'), {
  onStart: (s) => console.log('start', s),
  onShowRules: () => console.log('rules'),
});
settings.show({ opponent: 'cpu', courseId: 'hairpin', cpuLevel: 'normal', turnOrder: 'lottery', alert: true });

const result = new ResultScreen(document.getElementById('s2'), {
  onRetry: () => console.log('retry'),
  onBackToSettings: () => console.log('back'),
});
result.show(
  { winner: 1, reason: 'tieRule', moveCounts: [14, 14] },
  { players: [{color:'red'},{color:'blue'}] }
);

window.__ready = true;
</script>
</body>
</html>
